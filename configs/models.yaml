# Pinned open-weight model configurations for 16 GB VRAM (NVIDIA T4) & CPU execution.
# Models MUST run sequentially — never load multiple large models simultaneously.

video:
  primary:
    family: "LTX-Video"
    repo_id: "Lightricks/LTX-Video"
    checkpoint_file: "ltxv-2b-0.9.8-distilled.safetensors"
    diffusers_repo: "Lightricks/LTX-Video"
    dtype: "float16" # T4 Turing lacks native fast bf16 tensor cores; use float16 on T4
    width: 704
    height: 480
    num_frames: 49 # ~2 seconds at 24fps; safe for 16GB T4
    fps: 24
    num_inference_steps: 8
    guidance_scale: 1.0 # Distilled checkpoint uses low/unit guidance
    enable_vae_tiling: true
    enable_vae_slicing: true
    enable_cpu_offload: true
    license: "LTX-Video Community/Research License (check LICENSE.txt in repo for commercial terms)"

  fallback:
    family: "HunyuanVideo-1.5"
    repo_id: "tencent/HunyuanVideo-1.5"
    diffusers_t2v_repo: "hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_t2v"
    diffusers_i2v_repo: "hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_i2v_step_distilled"
    dtype: "float16"
    width: 832
    height: 480
    num_frames: 49
    fps: 24
    num_inference_steps: 8
    enable_cpu_offload: true
    license: "Tencent Hunyuan Community License (NOT licensed in EU, UK, or South Korea)"
    territory_restricted: true

image:
  primary:
    family: "Stable Diffusion 1.5"
    repo_id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
    dtype: "float16"
    width: 768
    height: 432 # 16:9 native aspect, upscaled cleanly in FFmpeg
    num_inference_steps: 25
    guidance_scale: 7.5
    enable_cpu_offload: false # Fits easily in <4GB VRAM on T4
    license: "CreativeML Open RAIL-M"

llm:
  primary:
    family: "Qwen2.5"
    repo_id: "Qwen/Qwen2.5-1.5B-Instruct"
    device: "auto" # Uses GPU when video/image models are unloaded, or CPU fallback
    dtype: "float16"
    max_new_tokens: 2048
    temperature: 0.7
    license: "Apache-2.0"

tts:
  primary:
    family: "Kokoro-82M"
    repo_id: "hexgrad/Kokoro-82M"
    device: "cpu" # Runs at ~0.46-0.50 RTF on CPU, preserving 100% of GPU VRAM
    sample_rate: 24000
    default_voice: "af_heart"
    lang_code: "a" # American English
    license: "Apache-2.0"
