name: Automated Kaggle GPU Production

on:
  # Runs every Monday and Thursday at 06:00 UTC (respects 30h/week Kaggle GPU quota)
  schedule:
    - cron: "0 6 * * 1,4"

  # Manual trigger from GitHub Actions UI with optional topic override
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave blank to pull next QUEUED/PAUSED job from Cloudflare D1)"
        required: false
        default: ""
      duration_sec:
        description: "Target long-form duration in seconds"
        required: false
        default: "600"

jobs:
  trigger-kaggle-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enqueue manual topic in Cloudflare D1 (if provided)
        if: ${{ github.event.inputs.topic != '' && secrets.CF_WORKER_URL != '' }}
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          DURATION: ${{ github.event.inputs.duration_sec }}
        run: |
          curl -fsSL -X POST "${CF_WORKER_URL%/}/jobs" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CF_API_KEY}" \
            -d "{\"topic\": \"${TOPIC}\", \"target_duration_sec\": ${DURATION}}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --quiet --upgrade kaggle

      - name: Configure Kaggle credentials & kernel metadata
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            printf '%s\n' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "ERROR: Set KAGGLE_API_TOKEN (or KAGGLE_USERNAME + KAGGLE_KEY) in GitHub secrets."
            exit 1
          fi

          RESOLVED_USER="${KAGGLE_USERNAME:-}"
          if [ -z "$RESOLVED_USER" ]; then
            RESOLVED_USER="$(kaggle config view | awk -F': ' '/username/{print $2}' | tr -d '[:space:]' || true)"
          fi
          if [ -z "$RESOLVED_USER" ]; then
            echo "ERROR: Could not resolve Kaggle username. Set KAGGLE_USERNAME secret in GitHub."
            exit 1
          fi

          python3 - << EOF
          import json
          from pathlib import Path

          meta_path = Path("notebooks/kernel-metadata.json")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          slug = meta["id"].split("/", 1)[1]
          meta["id"] = "${RESOLVED_USER}/" + slug
          meta_path.write_text(json.dumps(meta, indent=2), encoding="utf-8")
          EOF

      - name: Push and start Kaggle GPU kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p notebooks
