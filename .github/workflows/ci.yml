name: CI (Non-GPU Tests)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet PyYAML==6.0.2 Pillow==11.0.0 numpy==1.26.4 matplotlib==3.9.4 pytest==8.3.4 requests==2.32.3
      - name: Compile and run non-GPU unit tests
        run: |
          python -m compileall -q inference rendering storage orchestration scripts tests
          python -m pytest -v -k "not cuda"
